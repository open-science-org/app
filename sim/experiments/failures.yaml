id: failures
title: 'Learning from failure: own failures vs. shared failures'
description: >-
  With the learning oracle, each failed attempt raises the next chance on that result by 10% of p.
  With rules.publishFailures, failed attempts are public, so agents also learn from others' failures
  (sharedWeight = 1). Compared under traditional and OSO (immediate) rules on the default world.
seeds: 100
factors:
  - name: setting
    levels:
      - { label: Traditional, preset: traditional }
      - { label: OSO (immediate), preset: oso }
  - name: failures
    levels:
      - { label: no learning, set: { success.oracle: { kind: chance } } }
      - { label: learn from own, set: { success.oracle: { kind: learning, gain: 0.1 } } }
      - { label: learn from all (public), set: { success.oracle: { kind: learning, gain: 0.1 }, rules.publishFailures: true } }
columns: [frontier, reachTarget, speed, cost, spend, targetsSolved, waste, credit]
