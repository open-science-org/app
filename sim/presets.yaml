# Named sets of overrides that experiments can refer to with `preset: <name>`.
# The six rule settings of sim/README.md, section 2.3.

traditional:
  rules: { alpha: 1, c: 0, visibility: { kind: finished-only } }
oso:
  rules: { alpha: 0.8, c: 0.15, visibility: { kind: immediate } }
creditOnly:
  rules: { alpha: 0.8, c: 0.15, visibility: { kind: finished-only } }
sharingOnly:
  rules: { alpha: 1, c: 0, visibility: { kind: immediate } }
traditionalChoice:
  rules: { alpha: 1, c: 0, visibility: { kind: choice } }
osoChoice:
  rules: { alpha: 0.8, c: 0.15, visibility: { kind: choice } }
