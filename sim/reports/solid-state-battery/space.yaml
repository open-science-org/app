id: solid-state-battery
title: A solid-state battery
summary: Twenty results from electrolyte chemistry to a working cell, written out by hand; two prizes.
description: "Building a solid-state lithium battery. Three lines of work run in parallel: the solid
  electrolyte (finding a conducting material, making it stable and making it thin), the interfaces
  (stopping dendrites and keeping contact as the cell breathes), and manufacturing (making layers at
  scale). A working laboratory cell needs results from all three; a cell that survives a thousand
  cycles needs more. Some promising lines (a polymer electrolyte, a coating that never scales) lead
  nowhere."
glossary:
  result: a demonstrated material property or process step
  target: a cell that meets a performance milestone
  attempt: one round of synthesis and testing
  area: a line of work
  agent: a lab or startup
areas:
  - electrolyte
  - interfaces
  - manufacturing
