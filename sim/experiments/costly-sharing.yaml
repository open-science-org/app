id: costly-sharing
title: "Sharing isn't free: absorbing costs and wrong results"
description: >-
  Taking up a published result costs `absorbCost` compute, and each proof is wrong with chance
  `errorRate`; results built on a wrong result are wrong, and a target check rejects them and
  retracts the wrong results. Where does OSO's advantage shrink or vanish? Default world.
seeds: 100
factors:
  - name: setting
    levels:
      - { label: Traditional, preset: traditional }
      - { label: OSO (immediate), preset: oso }
  - { name: absorb cost, path: knowledge.absorbCost, values: [0, 0.25, 0.5, 1] }
  - { name: error rate, path: knowledge.errorRate, values: [0, 0.05, 0.15] }
columns: [frontier, reachTarget, cost, spend, targetsSolved, absorbSpend, rejected, retracted]
