id: alpha-psi
title: 'Where sharing becomes rational: α × scoop risk ψ × cited share c'
description: >-
  Agent's-choice visibility. ψ is how much publishing a lemma raises a rival's chance of winning the
  target below it; c is the share of each mint paid to what a result built on.
seeds: 100
set:
  rules.visibility: { kind: choice }
factors:
  - { name: ψ, path: behaviour.psi, values: [0.5, 0.25, 0.1] }
  - { name: α, path: rules.alpha, values: [1, 0.8, 0.5, 0.3, 0.1] }
  - { name: c, path: rules.c, values: [0, 0.15] }
exclude:
  - { rules.alpha: 1, rules.c: 0.15 }
