id: alpha-sweep
title: α sweep under agent's-choice visibility
description: >-
  Agents choose whether to publish each lemma (section 2.5 of sim/README.md). α from 1 (traditional)
  down to 0.1, with c = 0.15 (c = 0 at α = 1). Default scoop risk ψ = 0.5.
seeds: 100
set:
  rules: { c: 0.15, visibility: { kind: choice } }
factors:
  - { name: α, path: rules.alpha, values: [1, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1] }
patches:
  - { when: { rules.alpha: 1 }, set: { rules.c: 0 } }
